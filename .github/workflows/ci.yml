name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: arctern

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arctern

      # build.rs embeds admin-ui/dist via memory_serve; an empty dir is enough
      # to compile (integration tests are gated behind the `integration` feature
      # and need real ZFS/SSH, so they stay off here).
      # build.rs embeds admin-ui/dist via memory_serve (empty dir is fine), and
      # router.rs `include_bytes!`s dist/index.html for the SPA fallback — so a
      # stub index.html must exist to compile without building the real UI.
      - run: mkdir -p admin-ui/dist && printf '<!doctype html><title>arctern</title>' > admin-ui/dist/index.html
        working-directory: arctern
      - run: cargo fmt --all --check
        working-directory: arctern
      # --all-targets so test code is linted too, matching `just lint`.
      # Without it CI passed on lints that only fail on the developer's
      # machine, which is the wrong way round.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: arctern
      - run: cargo test --workspace
        working-directory: arctern
      # The integration tests need a ZFS host over SSH, so they cannot run
      # here — but `cargo test --workspace` does not even compile them
      # (they are `#![cfg(feature = "integration")]`), which let them rot
      # unnoticed between VM runs. Type-check them without running.
      - run: cargo check --workspace --all-targets --features integration
        working-directory: arctern

      - name: Check OpenAPI schema
        run: cargo run -q -p arctern-daemon -- openapi | diff -u admin-ui/openapi.json -
        working-directory: arctern

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true
          working-directory: admin-ui

      - run: vp install
        working-directory: admin-ui
        env:
          VITE_GIT_HOOKS: "0"
      - name: Check generated client
        run: vp exec openapi-ts && git diff --exit-code -- src/client
        working-directory: admin-ui
      - run: vp check
        working-directory: admin-ui
      - run: vp test
        working-directory: admin-ui
      - run: vp run build
        working-directory: admin-ui
